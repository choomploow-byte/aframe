<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AFrame promo card</title>
    <style>
      @font-face {
        font-family: 'Lilita One';
        src: url(../../site/fonts/lilita-one-latin-400-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Fredoka';
        font-weight: 300 700;
        src: url(../../site/fonts/fredoka-latin-wght-normal.woff2) format('woff2-variations');
      }
      :root {
        --bg: #1b1330;
        --panel: #2d2250;
        --ink: #ffffff;
        --dim: #c9bef0;
        --gold: #ffb020;
        --outline: #120b24;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: var(--w);
        height: var(--h);
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(ellipse 60% 70% at 78% 45%, #5b3cb0aa 0%, #5b3cb000 70%),
          radial-gradient(ellipse 50% 50% at 0% 100%, #8a6ee033 0%, #8a6ee000 70%), var(--bg);
        font-family: 'Fredoka', system-ui, sans-serif;
        color: var(--ink);
      }
      .rays {
        position: absolute;
        inset: -40%;
        background: repeating-conic-gradient(
          from 0deg at var(--cx) var(--cy),
          #ffffff0d 0deg 5deg,
          #ffffff00 5deg 10deg
        );
        mask-image: radial-gradient(circle at var(--cx) var(--cy), #000 0%, #0000 70%);
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, #ffffff14 1.6px, #0000 2px);
        background-size: 14px 14px;
        mask-image: linear-gradient(100deg, #0000 40%, #000 100%);
      }
      .copy {
        position: absolute;
        left: var(--pad);
        top: var(--copy-top);
        width: var(--copy-w);
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }
      .wordmark {
        height: var(--wm);
        width: auto;
        align-self: flex-start;
      }
      h1 {
        font-family: 'Lilita One', sans-serif;
        font-weight: 400;
        font-size: var(--h1);
        line-height: 1.02;
        letter-spacing: 0.01em;
        text-shadow: 0 4px 0 #120b24;
      }
      h1 em {
        font-style: normal;
        color: var(--gold);
      }
      p.sub {
        font-size: var(--sub);
        line-height: 1.3;
        color: var(--dim);
        font-weight: 500;
        max-width: 92%;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        align-self: flex-start;
        font-family: 'Lilita One', sans-serif;
        font-size: var(--cta);
        letter-spacing: 0.03em;
        color: var(--outline);
        padding: 0.35em 1.3em 0.5em;
        border-radius: 999px;
        background: var(--gold);
        border: 4px solid var(--outline);
        box-shadow:
          inset 0 2px 0 #ffffffb3,
          inset 0 14px 14px -10px #ffffff66,
          0 8px 0 #9e6d14,
          0 16px 22px #00000066;
      }
      .tag {
        font-size: calc(var(--sub) * 0.78);
        color: var(--dim);
        font-weight: 500;
      }
      .shot {
        position: absolute;
        border-radius: 22px;
        border: 5px solid var(--outline);
        background: var(--panel);
        box-shadow:
          0 0 0 2px #ffffff22,
          0 30px 50px #0009;
        overflow: hidden;
      }
      .shot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .float {
        position: absolute;
        filter: drop-shadow(0 8px 0 #120b24) drop-shadow(0 14px 14px #0008);
      }
      .float svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      body[data-format='landscape'] {
        --w: 1200px;
        --h: 630px;
        --pad: 64px;
        --copy-top: 70px;
        --copy-w: 560px;
        --gap: 24px;
        --wm: 92px;
        --h1: 70px;
        --sub: 25px;
        --cta: 36px;
        --cx: 78%;
        --cy: 48%;
      }
      body[data-format='square'] {
        --w: 1080px;
        --h: 1080px;
        --pad: 72px;
        --copy-top: 56px;
        --copy-w: 800px;
        --gap: 20px;
        --wm: 88px;
        --h1: 88px;
        --sub: 29px;
        --cta: 42px;
        --cx: 50%;
        --cy: 74%;
      }
    </style>
  </head>
  <body data-format="landscape">
    <div class="rays"></div>
    <div class="dots"></div>
    <div class="copy">
      <img class="wordmark" src="../../site/img/wordmark-3d-on-dark.png" alt="AFrame" />
      <h1>Design <em>game UI</em><br />with your AI.</h1>
      <p class="sub">Free and open source. Claude Code or Codex builds on a canvas you can see.</p>
      <div class="cta">Get it free</div>
      <div class="tag" id="tag"></div>
    </div>
    <div id="shots"></div>
    <div id="floats"></div>
    <script>
      const format = new URLSearchParams(location.search).get('format') ?? 'landscape';
      document.body.dataset.format = format;
      const shots =
        format === 'landscape'
          ? [
              ['hud', 590, 128, 520, 292, 5],
              ['shop', 640, 292, 500, 281, -4],
            ]
          : [
              ['hud', 40, 750, 520, 292, -4],
              ['shop', 450, 775, 560, 315, 4],
            ];
      const box = document.getElementById('shots');
      for (const [name, x, y, w, h, rot] of shots) {
        const d = document.createElement('div');
        d.className = 'shot';
        d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)`;
        d.innerHTML = `<img src="../../site/img/${name}.png" alt="">`;
        box.appendChild(d);
      }
      const ICONS = window.__ICONS__ ?? {};
      const floats =
        format === 'landscape'
          ? [
              ['coins', '#ffc83d', 1010, 56, 96, 8],
              ['gem', '#38d6ff', 560, 410, 92, -10],
              ['sword', '#e6ddff', 1085, 380, 110, 6],
              ['star', '#ffc83d', 575, 70, 62, -12],
              ['potion', '#ff4d6d', 1010, 520, 70, 10],
            ]
          : [
              ['coins', '#ffc83d', 880, 400, 120, 8],
              ['gem', '#38d6ff', 880, 600, 104, -10],
              ['sword', '#e6ddff', 930, 900, 130, 6],
              ['star', '#ffc83d', 740, 470, 76, -12],
              ['key', '#ffc83d', 10, 990, 84, 12],
            ];
      const fl = document.getElementById('floats');
      for (const [name, colour, x, y, size, rot] of floats) {
        const icon = ICONS[name];
        if (!icon) continue;
        const d = document.createElement('div');
        d.className = 'float';
        d.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;transform:rotate(${rot}deg);color:${colour}`;
        d.innerHTML = `<svg viewBox="0 0 ${icon.vb[0]} ${icon.vb[1]}"><path d="${icon.d}" fill="currentColor" ${icon.eo ? 'fill-rule="evenodd"' : ''} stroke="#120b24" stroke-width="26" paint-order="stroke" stroke-linejoin="round"/></svg>`;
        fl.appendChild(d);
      }
      document.getElementById('tag').textContent =
        'Windows · Claude Code · Codex · runs on your own PC';
    </script>
  </body>
</html>

name: Release
on:
  push:
    tags: ['v*']

jobs:
  desktop:
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, args: '--target aarch64-apple-darwin' }
          - { platform: macos-13, args: '--target x86_64-apple-darwin' }
          - { platform: ubuntu-22.04, args: '' }
          - { platform: windows-latest, args: '' }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: npm ci
      - run: npm run build:mcp
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (optional for alpha, required for smooth installs):
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # WINDOWS signing via Azure Trusted Signing or a certificate; TAURI_SIGNING_PRIVATE_KEY for the updater
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Atelier ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: true
          args: ${{ matrix.args }}

  npm-mcp:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm run build:mcp
      # Publishes the standalone MCP bundle package (see docs/09 Route 3)
      - run: npm publish --provenance --access public
        working-directory: mcp-package
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }

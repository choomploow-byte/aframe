[package]
name = "atelier"
version = "0.1.1"
description = "Open-source AI design studio"
edition = "2021"
license = "MIT"

[lib]
name = "atelier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned to the 2.x line on purpose: a Tauri 3.0 alpha is published on crates.io (decision log #12).
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"

# Added in later phases, each with a justification in its commit:
# tauri-plugin-single-instance = "2"  (must be registered first)
# tauri-plugin-window-state = "2"
# tauri-plugin-dialog = "2"
# tauri-plugin-opener = "2"
# tauri-plugin-http = "2"             (AI provider calls from Rust, Phase 7)
# serde / serde_json / dirs           (confined fs commands, Phase 4)
# NOTE: tauri-plugin-fs is deliberately not used (decision log #16).

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

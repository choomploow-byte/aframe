[package]
name = "aframe"
version = "0.3.0"
description = "Open-source AI design studio"
edition = "2021"
license = "MIT"

[lib]
name = "aframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned to the 2.x line on purpose: a Tauri 3.0 alpha is published on crates.io (decision log #12).
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
dirs = "7.0.0"
keyring = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
ureq = "3"

# Added in later phases, each with a justification in its commit:
# tauri-plugin-single-instance = "2"  (must be registered first)
# tauri-plugin-window-state = "2"
# tauri-plugin-opener = "2"
# AI provider calls are made by src/ai.rs with `ureq`, keys live in the OS credential store (`keyring`).
# serde / serde_json / dirs           (confined fs commands, Phase 4)
# NOTE: tauri-plugin-fs is deliberately not used (decision log #16).

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
